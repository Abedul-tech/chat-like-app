server:
  port: 8050

spring:
  application:
    name: mcsv-message

  cassandra:
    keyspace-name: CHAT
    contact-points: cassandra-db #127.0.0.1 only works if your app runs on the host machine
    port: 9042
    schema-action: CREATE_IF_NOT_EXISTS
    local-datacenter: datacenter1

management:
  endpoints:
    web:
      exposure:
        include: health

#Eureka configuration—Connecting to it
eureka:
  client:
    service-url:
      defaultZone: http://mcsv-eureka:8761/eureka/