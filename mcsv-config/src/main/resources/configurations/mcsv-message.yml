server:
  port: 8050

spring:
  application:
    name: mcsv-message

  kafka:
    bootstrap-servers: localhost:9092
    template:
      default-topic: chat # Still present, benign if not producing
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring:
          deserializer:
            value:
              delegate:
                #JsonDeserializer is from Spring Kafka and is used to convert JSON messages (received from Kafka) into Java objects.
                #THIS LOOKS FOR THE KAFKA HEADER WHICH IS "event" which is a _TypeId_
                class: org.springframework.kafka.support.serializer.JsonDeserializer
          json:
            type: #kafka messages have a header "event", when the consumer reads this, it should deserialize it
              mapping: event:com.alen.dto.MessageDto
            trusted: #checks if the class comes from a trusted package
              packages: "java.util,java.lang,com.alen.dto,com.alen.dto.*"

management:
  endpoints:
    web:
      exposure:
        include: health

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10