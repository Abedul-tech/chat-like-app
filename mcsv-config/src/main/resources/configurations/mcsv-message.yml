server:
  port: 8010
spring:
  application:
    name: mcsv-message
  cassandra:
    keyspace-name: CHAT
    contact-points: 127.0.0.1
    port: 9042
    schema-action: CREATE_IF_NOT_EXISTS
    local-datacenter: datacenter1
  redis:
    host: localhost
    port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring:
          deserializer:
            value:
              delegate:
                #JsonDeserializer is from Spring Kafka and is used to convert JSON messages (received from Kafka) into Java objects.
                #THIS LOOKS FOR THE KAFKA HEADER WHICH IS "event" which is a _TypeId_
                class: org.springframework.kafka.support.serializer.JsonDeserializer
          json:
            type: #kafka messages have a header "event", when the consumer reads this, it should deserialize it
              mapping: msgEvent:com.alen.dto.MessageDto
            trusted: #checks if the class comes from a trusted package
              packages: "com.alen.dto.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: msgBackEvent:com.alen.dto.MessageBackDto

management:
  endpoints:
    web:
      exposure:
        include: health

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10