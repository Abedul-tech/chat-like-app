server:
  port: 8761

spring:
  application:
    name: mcsv-eureka

  zipkin:
    base-url: http://localhost:9411 #server where zipkin is running
  sleuth:
    sampler:
      probability: 1.0 #goes from 0.0 to 1.0 where 1.0 means that all the request will be traced in the server
#Connecting to eureka
eureka:
  instance:
    hostname: localhost
  client:
    #Disable autosave eureka within its own server
    register-with-eureka: false
    fetch-registry: false
    #Path of eureka server
    service-url:
      defaultZone: http://localhost:${server.port}/eureka/ # Ensure `service-url`, not `server-url`

#exposes the /actuator/health endpoint
management:
  endpoints:
    web:
      exposure:
        include: health