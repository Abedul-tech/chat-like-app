server:
  port: 8090
jwt:
  secret: NTFjNWJlNDM4ZWFhYWUwNzE4NmZlMDQzNQ==NTFjNWJlNDM4ZWFhYWUwNzE4NmZlMDQzNQ==
#To ignore classes/components
feature:
  enabled: false

spring:
  application:
    name: mcsv-websocket
  #Spring level to define beans will be used throughout the service
  kafka:
    bootstrap-servers: localhost:9092 #Kafka broker port
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer #Define how to serialize the key
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer #And the object
      properties: # When a Kafka message includes a header with _type=logEvent, the serializer knows to deserialize it into a LogEventDto object.
        spring.json.type.mapping: | 
          msgEvent:com.alen.dto.MessageDto, 
          sessionEvent:com.alen.dto.UserSessionDto,
          heartbeatEvent:com.alen.dto.HeartbeatDto
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties.spring:
        deserializer:
          value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        json:
          type.mapping: | 
            msgBackEvent:com.alen.dto.MessageBackDto,
            onlineEvent:com.alen.dto.OnlineUsersEvent
          trusted.packages: "com.alen.dto"
  redis:
    host: localhost
    port: 6379
#  zipkin:
#    base-url: http://localhost:9411 #server where zipkin is running
#  sleuth:
#    sampler:
#      probability: 1.0 #goes from 0.0 to 1.0 where 1.0 means that all the request will be traced in the server
#logging:
#  level:
#    org.springframework.security: DEBUG
#    org.springframework.web.cors: DEBUG
#    org.springframework.boot.autoconfigure: DEBUG
#to check health of service
management:
  endpoints:
    web:
      exposure:
        include: beans, health, info, conditions
  endpoint:
    beans:
      enabled: true  # Explicitly enable beans endpoint
    conditions:
      enabled: true  # Useful for debugging @ConditionalOnProperty

#Eureka connection
eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10