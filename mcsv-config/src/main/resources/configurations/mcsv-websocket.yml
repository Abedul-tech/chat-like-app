server:
  port: 8090

spring:
  application:
    name: mcsv-websocket
  #Spring level to define beans will be used throughout the service
  kafka:

  cassandra:
    keyspace-name: CHAT
    contact-points: 127.0.0.1
    port: 9042
    schema-action: CREATE_IF_NOT_EXISTS
    local-datacenter: datacenter1
        # Auto-creates tables from your @Table entities

  zipkin:
    base-url: http://localhost:9411 #server where zipkin is running
  sleuth:
    sampler:
      probability: 1.0 #goes from 0.0 to 1.0 where 1.0 means that all the request will be traced in the server

management:
  endpoints:
    web:
      exposure:
        include: health

#Eureka connection
eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
